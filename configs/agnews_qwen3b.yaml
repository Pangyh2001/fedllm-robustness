seed: 42
output_dir: outputs/agnews_qwen3b
run_name: agnews_alpha01
device: cuda

data:
  name: agnews
  cache_dir: /home/yhpang/.cache/huggingface/datasets
  max_train_samples: null
  max_test_samples: null
  max_length: 256
  num_clients: 10
  dirichlet_alpha: 0.1
  partition_mode: label_skew_equal
  val_fraction: 0.1
  min_client_samples: 64
  min_client_test_samples: 100

model:
  name_or_path: /data/yhpang/model_weights/qwen2_5_3b_instruct
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  dtype: bfloat16

attack:
  epsilon: 0.03
  epsilon_mode: relative_rms
  train_steps: 3
  eval_steps: [10, 20, 50]
  eval_restarts: 5
  random_start: true

federated:
  algorithm: fedeat_tail
  rounds: 50
  local_epochs: 1
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 0.0002
  client_fraction: 1.0
  adv_weight: 0.3
  clean_consistency_weight: 0.1
  calfat_tau: 0.1
  sfat_top_k: 2
  sfat_multiplier: 1.4
  qfed_q: 1.0
  warmup_rounds: 5
  residual_weight: 1.0
  residual_ema: 0.0
  vulnerability_ema: 0.9
  tail_ratio: 0.2
  tail_reweight: 2.0
  qp_rho: 10.0
  qp_kappa: 0.1
  evaluate_every: 5
  max_eval_batches: null
